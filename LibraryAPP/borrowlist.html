<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Borrowing Records</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h2>Library Borrowing Records</h2>

    <table id="recordsTable">
      <thead>
        <tr>
          <th>Title</th>
          <th>Borrow Date</th>
          <th>Return Date</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <button onclick="goToBookList()">Back to Book List</button>
    <button onclick="logout()">Logout</button>
  </div>

  <script src="./borrowlist.js"></script>
</body>
</html>
